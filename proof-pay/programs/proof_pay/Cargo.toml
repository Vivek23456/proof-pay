[package]
name = "proof_pay"
version = "0.1.0"
description = "ProofPay — portable cross-merchant customer reputation on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "proof_pay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
